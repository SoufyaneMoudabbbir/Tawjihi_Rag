version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tawjihi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DATABASE_PATH=/app/data/database.sqlite
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - LOG_LEVEL=INFO
      - RATE_LIMIT_PER_MINUTE=60
      - MAX_FILE_SIZE_MB=50
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    networks:
      - tawjihi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tawjihi-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_FRONTEND_URL=http://localhost:3000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NODE_ENV=production
    volumes:
      - frontend_uploads:/app/uploads
      - frontend_data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tawjihi-network

  # Optional: Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: tawjihi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tawjihi-network
    command: redis-server --appendonly yes

volumes:
  backend_data:
    driver: local
  backend_uploads:
    driver: local
  frontend_uploads:
    driver: local
  frontend_data:
    driver: local
  redis_data:
    driver: local

networks:
  tawjihi-network:
    driver: bridge
